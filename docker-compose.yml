services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    volumes:
      - ~/.claude:/home/claude_data:ro
      - devlens_db:/app/data
    environment:
      CLAUDE_DATA_PATH: /home/claude_data
      DATABASE_URL: sqlite:////app/data/devlens.db
    restart: unless-stopped

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped

volumes:
  devlens_db:
